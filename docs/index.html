<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<meta name="description" content="神秘指南 —— 每天两三分钟的神秘学微课">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tools.css">
<title>神秘指南</title>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="返回" hidden>‹</button>
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-text">神秘指南</span>
  </div>
  <div class="top-right">
    <div class="streak" id="streakChip" title="连续天数">
      <span class="flame">◆</span><span id="streakNum">0</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="tab active"><span class="tab-ico">◎</span>今天</button>
  <button data-tab="courses" class="tab"><span class="tab-ico">▤</span>课程</button>
  <button data-tab="books" class="tab"><span class="tab-ico">▥</span>书库</button>
  <button data-tab="tools" class="tab"><span class="tab-ico">✦</span>工具</button>
  <button data-tab="me" class="tab"><span class="tab-ico">◇</span>我的</button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/lunar.js"></script>
<script src="tools.js"></script>
<script src="tools2.js"></script>
<script src="tools3.js"></script>
<script src="local-books.js"></script>
<script src="app.js"></script>
</body>
</html>
